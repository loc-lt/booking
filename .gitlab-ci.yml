# Booking Core pipeline: a starting point. What it must check is described in docs/operations.md.
# Adjust images, runner tags and script names as the project takes shape.
# $CI_DEFAULT_BRANCH is the project's default branch: master.

stages: [check, test, build, deploy]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------- shared setup ----------

.node:
  image: node:24-alpine
  before_script:
    - apk add --no-cache git
    - corepack enable
    - cd web
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files: [web/pnpm-lock.yaml]
    paths: [web/.pnpm-store]

.python:
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  before_script:
    - pip install -r core/api/requirements-dev.txt
  cache:
    key:
      files: [core/api/requirements-dev.txt]
    paths: [.cache/pip]

# ---------- check ----------

lint_web:
  extends: .node
  stage: check
  script:
    - pnpm lint          # Biome, including import-boundary rules
    - pnpm typecheck

lint_api:
  extends: .python
  stage: check
  script:
    - ruff check core/api
    - ruff format --check core/api
    - (cd core/api && lint-imports)   # import-linter: modules only use each other's service.py

contract:
  extends: .node
  stage: check
  script:
    - pnpm spectral lint ../contracts/openapi.yaml
    - pnpm gen
    - git diff --exit-code -- packages/api-client   # generated code must be committed

docs_readme:
  image: python:3.12-slim
  stage: check
  script:
    - python3 scripts/merge-docs.py
    - git diff --exit-code -- README.md   # docs/ changed without regenerating README.md

banned_words:
  image: debian:bookworm-slim   # GNU grep, which supports \b
  stage: check
  script:
    - |
      if grep -rniE 'coworking|co_working|workplace|member_plan|\boffice\b' core web/packages web/apps; then
        echo "Product-specific words found outside seeds/. See docs/core-boundaries.md."
        exit 1
      fi

# ---------- test ----------

test_api:
  extends: .python
  stage: test
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_DB: booking_core_test
    POSTGRES_USER: booking
    POSTGRES_PASSWORD: booking
    DATABASE_URL: postgresql://booking:booking@postgres:5432/booking_core_test
  script:
    - pytest core/api/tests

test_web:
  extends: .node
  stage: test
  script:
    - pnpm test

api_contract_and_seeds:
  stage: test
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    # Start the stack, apply every seed through the public API, then run Schemathesis against it.
    # Fill in once the API and seeds exist.
    - docker compose -f infra/compose.yaml up -d --wait postgres api
    - echo "TODO: apply seeds/ and run Schemathesis against contracts/openapi.yaml"

# ---------- build ----------

build_images:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA" core/api
    - docker build -f infra/web/Dockerfile --build-arg APP=console -t "$CI_REGISTRY_IMAGE/console:$CI_COMMIT_SHA" .
    - docker build -f infra/web/Dockerfile --build-arg APP=member -t "$CI_REGISTRY_IMAGE/member:$CI_COMMIT_SHA" .
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        for image in api console member; do
          docker push "$CI_REGISTRY_IMAGE/$image:$CI_COMMIT_SHA"
        done
      fi

# ---------- deploy ----------
# Runs on the GitLab Runner installed on the demo server, so no SSH access is needed.
# Rollback: re-run this job from the previous commit's pipeline.

deploy_demo:
  stage: deploy
  tags: [demo-server]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    TAG: $CI_COMMIT_SHA
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker compose -f infra/compose.server.yaml --env-file /srv/booking-core/.env pull
    - docker compose -f infra/compose.server.yaml --env-file /srv/booking-core/.env run --rm api python manage.py migrate --noinput
    - docker compose -f infra/compose.server.yaml --env-file /srv/booking-core/.env up -d
    - curl --fail --retry 10 --retry-delay 3 http://localhost:3000/api/healthz
