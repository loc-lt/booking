openapi: 3.1.0

info:
  title: Booking Core API
  version: "1"
  description: >
    The booking core API. See docs/api.md for conventions and the contract
    workflow. This file is the only description of the API; the client, Zod
    schemas and mocks in web/packages/api-client are generated from it.

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Signing in to the booking core (D-003). No X-Tenant-Id.
  - name: resource-types
    description: Templates for bookable things (desk, meeting room, phone booth).
  - name: resources
    description: Individual bookable things of a resource type.
  - name: availability
    description: Free/busy search over a resource type's resources.
  - name: bookings
    description: Requests for a resource and the lifecycle moves they go through.
  - name: people
    description: Who is calling, members, invitations, roles built from permission codes.
  - name: sites
    description: Physical places with a timezone, opening hours and exceptions.
  - name: rules
    description: Versioned booking rules (eligibility, limits, approval) evaluated by the pipeline.
  - name: payments
    description: Upfront payment, desk payments, refunds and gateway webhooks.
  - name: events
    description: The tenant's event log (outbox) with delivery state.

paths:
  /auth/register:
    post:
      operationId: register
      summary: Create an account
      description: >
        Email + password. Returns a token pair, like login. An email with a pending
        invitation is refused: that person uses the link in the invitation email.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      description: >
        Unknown email and wrong password get the same 401. After AUTH_MAX_FAILED_LOGINS wrong
        passwords in a row the account is locked for AUTH_LOCK_MINUTES.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: Get a new token pair
      description: >
        The refresh token is single use: the answer carries a new one. Sending an already
        used refresh token again ends that whole session (it has probably leaked).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: Ends the session the refresh token belongs to. Access tokens expire by themselves.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Signed out.
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Email a password reset link
      description: Always 202, whether or not the email has an account.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: If the account exists, a link is on its way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password with the emailed link
      description: The link works once. Every session of the account ends.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Signed in with the new password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/password/change:
    post:
      operationId: changePassword
      summary: Change my password
      description: Needs a token, no X-Tenant-Id. Every other session of the account ends.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: New tokens for this device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /auth/invitations/accept:
    post:
      operationId: acceptInvitationLink
      summary: Join a tenant with the invitation link
      description: >
        A new person chooses a password; someone who already has an account enters theirs.
        The membership becomes active and the answer signs the person in.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationLinkRequest"
      responses:
        "200":
          description: Signed in and a member of the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationAccepted"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/guest:
    post:
      operationId: guestToken
      summary: Book without an account
      description: >
        An access token of a few hours (no refresh token) for a new guest member of one
        tenant. Refused when the tenant turned guest bookings off (settings.guestBooking).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestTokenRequest"
      responses:
        "201":
          description: A guest token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestToken"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /me/tenants:
    get:
      operationId: listMyTenants
      summary: The tenants I belong to
      description: Needs a token, no X-Tenant-Id. Use it after login to choose the X-Tenant-Id.
      tags: [auth]
      responses:
        "200":
          description: Every membership of the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyTenantList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /resource-types:
    get:
      operationId: listResourceTypes
      summary: List resource types
      description: Lists the tenant's resource types, newest first.
      tags: [resource-types]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of resource types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceTypeList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createResourceType
      summary: Create a resource type
      description: Creates a resource type with its custom field definitions, published immediately.
      tags: [resource-types]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceTypeRequest"
            examples:
              phoneBooth:
                $ref: "#/components/examples/CreateResourceTypeRequestPhoneBooth"
      responses:
        "201":
          description: The created resource type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceType"
              examples:
                phoneBooth:
                  $ref: "#/components/examples/ResourceTypePhoneBooth"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /resource-types/{resourceTypeId}:
    get:
      operationId: getResourceType
      summary: Get a resource type
      description: Returns one resource type by id.
      tags: [resource-types]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ResourceTypeId"
      responses:
        "200":
          description: The resource type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceType"
              examples:
                phoneBooth:
                  $ref: "#/components/examples/ResourceTypePhoneBooth"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    patch:
      operationId: updateResourceType
      summary: Update a resource type's flow config
      description: >
        Changes the resource type's booking policies (confirmation, check-in,
        cancellation). Bookings already made keep the policies they were made
        under (see `Booking.appliedConfig`). Carries `baseVersion` so a stale
        edit is rejected instead of silently overwriting a newer change.
      tags: [resource-types]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ResourceTypeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResourceTypeRequest"
      responses:
        "200":
          description: The updated resource type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceType"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StaleVersion"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /resources:
    get:
      operationId: listResources
      summary: List resources
      description: Lists the tenant's resources, optionally filtered by type or site.
      tags: [resources]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: resourceTypeId
          in: query
          description: Only resources of this type.
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: siteId
          in: query
          description: Only resources at this site.
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: A page of resources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createResource
      summary: Create a resource
      description: Creates one bookable resource of an existing resource type at a site.
      tags: [resources]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceRequest"
            examples:
              phoneBooth1:
                $ref: "#/components/examples/CreateResourceRequestPhoneBooth1"
      responses:
        "201":
          description: The created resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
              examples:
                phoneBooth1:
                  $ref: "#/components/examples/ResourcePhoneBooth1"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /resources/{resourceId}:
    get:
      operationId: getResource
      summary: Get a resource
      description: Returns one resource by id.
      tags: [resources]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
              examples:
                phoneBooth1:
                  $ref: "#/components/examples/ResourcePhoneBooth1"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    patch:
      operationId: updateResource
      summary: Edit a resource
      description: Rename it or replace its custom field values (checked against the type's latest form).
      tags: [resources]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResourceRequest"
      responses:
        "200":
          description: The resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /availability:
    get:
      operationId: searchAvailability
      summary: Search free slots
      description: >
        Returns the day's slots for a resource type at a site, each with the
        resources still free for it. Applies hours, blackouts, slot size and
        buffers from the resource type's configuration.
      tags: [availability]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: siteId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: resourceTypeId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: date
          in: query
          description: The site-local calendar day to search.
          required: true
          schema:
            type: string
            format: date
        - name: resourceId
          in: query
          description: Only report free/busy for this one resource.
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: The day's slots and which resources are free for each.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
              examples:
                meetingRoomDay:
                  $ref: "#/components/examples/AvailabilityResponseExample"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /bookings:
    get:
      operationId: listBookings
      summary: List bookings
      description: Lists the tenant's bookings, newest first, optionally filtered.
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: resourceId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: resourceTypeId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: siteId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: memberId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: status
          in: query
          description: Only bookings in this status.
          required: false
          schema:
            $ref: "#/components/schemas/BookingStatus"
        - name: from
          in: query
          description: Only bookings overlapping this range (inclusive).
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: A page of bookings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createBooking
      summary: Submit a booking request
      description: >
        Runs the request through the booking pipeline (docs/domain/booking.md).
        Denied requests save nothing and return `BOOKING_DENIED` with the
        rules that blocked it.
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
            examples:
              meetingRoomRequest:
                $ref: "#/components/examples/CreateBookingRequestExample"
      responses:
        "201":
          description: The created booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
              examples:
                meetingRoomConfirmed:
                  $ref: "#/components/examples/BookingConfirmedExample"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SlotTaken"
        "422":
          $ref: "#/components/responses/BookingRequestFailed"

  /bookings/{bookingId}:
    get:
      operationId: getBooking
      summary: Get a booking
      description: Returns one booking by id, including the config it was made under and its status history.
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: The booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
              examples:
                meetingRoomConfirmed:
                  $ref: "#/components/examples/BookingConfirmedExample"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /bookings/{bookingId}/check-in:
    post:
      operationId: checkInBooking
      summary: Check in
      description: Moves a confirmed booking to checked_in. Only inside the resource type's check-in window.
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: The updated booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidTransition"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /bookings/{bookingId}/cancel:
    post:
      operationId: cancelBooking
      summary: Cancel
      description: Moves an awaiting_payment, pending_approval or confirmed booking to cancelled. Runs the cancellation policy.
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: The updated booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidTransition"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /bookings/{bookingId}/approve:
    post:
      operationId: approveBooking
      summary: Approve
      description: Moves a pending_approval booking to confirmed.
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: The updated booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidTransition"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /bookings/{bookingId}/reject:
    post:
      operationId: rejectBooking
      summary: Reject
      description: Moves a pending_approval booking to rejected and releases any held payment.
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectBookingRequest"
      responses:
        "200":
          description: The updated booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidTransition"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /resource-types/{resourceTypeId}/fields:
    post:
      operationId: addResourceTypeFields
      summary: Add custom fields
      description: >
        Adds fields to an existing resource type and publishes a new form for each
        affected scope. Records saved earlier keep the form they were checked against;
        nothing is rewritten. Keys are permanent: a key used before (even archived) is
        refused.
      tags: [resource-types]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ResourceTypeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFieldsRequest"
      responses:
        "200":
          description: The resource type with its new fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceType"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /resource-types/{resourceTypeId}/fields/{fieldKey}/archive:
