          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidTransition"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /members/{memberId}/enable:
    post:
      operationId: enableMember
      summary: Enable a disabled member
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidTransition"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /rules:
    get:
      operationId: getRuleSet
      summary: The current rule set
      description: Version 0 with no rules until the first publish.
      tags: [rules]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: The rules in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSet"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    put:
      operationId: publishRuleSet
      summary: Publish a new rule set
      description: >
        Replaces every rule with a new version. Each rule is checked first (id, stage,
        scope target exists, JSONLogic operators, effect fits the stage); errors come back
        per rule. Bookings keep the rule set version they were checked against.
      tags: [rules]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRulesRequest"
      responses:
        "200":
          description: The new rule set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSet"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/StaleVersion"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /rules/versions:
    get:
      operationId: listRuleSetVersions
      summary: Rule set history
      tags: [rules]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Every published version, newest first, without the rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSetVersionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /rules/versions/{version}:
    get:
      operationId: getRuleSetVersion
      summary: One past rule set
      tags: [rules]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: The rule set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSet"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /payments/reconciliation:
    get:
      operationId: listPaymentsToReconcile
      summary: Gateway messages a person must look at
      description: Money for a booking that is gone, wrong amounts, unknown sessions.
      tags: [payments]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentEventList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /payments/{paymentId}:
    get:
      operationId: getPayment
      summary: Get a payment
      description: With its refunds, gateway messages and status history. The booker or staff with payment.read.
      tags: [payments]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /payments/{paymentId}/mark-paid:
    post:
      operationId: markPaymentPaid
      summary: Record a payment taken at the desk
      description: pending → paid; the booking moves on (confirmed, or pending_approval if approval is needed).
      tags: [payments]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PaymentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkPaidRequest"
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidTransition"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /refunds/{refundId}/mark-succeeded:
    post:
      operationId: markRefundSucceeded
      summary: Record a refund paid out at the desk
      tags: [payments]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/RefundId"
      responses:
        "200":
          description: The payment, now refunded or partially refunded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidTransition"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /webhooks/payments/{gateway}/tenants/{tenantId}:
    post:
      operationId: receivePaymentWebhook
      summary: Payment gateway callback
      description: >
        Called by the payment gateway, not by apps: no JWT and no X-Tenant-Id. The tenant
        is part of the callback URL registered with the gateway; the body is signed
        (`X-Signature`: HMAC-SHA256 of the raw body, hex). Every message is stored first
        and answered 200, duplicates and bad signatures included, so the gateway stops
        resending; `outcome` says what happened.
      tags: [payments]
      security: []
      parameters:
        - name: gateway
          in: path
          required: true
          schema:
            type: string
            example: mock
        - name: tenantId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: X-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentWebhookRequest"
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /events:
    get:
      operationId: listEvents
      summary: The tenant's event log
      description: Events (docs/examples/event.json) newest first, with their delivery state.
      tags: [events]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: subjectId
          in: query
          description: Only events about this booking, resource, payment, member...
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: name
          in: query
          description: Name prefix, e.g. `booking.` or `payment.paid`.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      description: The tenant to act on behalf of, checked against the caller's memberships.
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    ResourceTypeId:
      name: resourceTypeId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Replaying the same key returns the original result instead of creating a second booking.
      required: true
      schema:
        type: string

    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    RefundId:
      name: refundId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ExceptionId:
      name: exceptionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    FieldKey:
      name: fieldKey
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Unauthenticated:
      description: Missing, invalid or expired token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: Not allowed in this tenant.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: No resource with that id in this tenant.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ValidationFailed:
      description: The request body failed validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblemDetails"
    SlotTaken:
      description: Someone else holds the slot.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InvalidTransition:
      description: A move the lifecycle doesn't allow from the booking's current status.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    StaleVersion:
      description: The edit was based on an outdated version.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    BookingRequestFailed:
      description: Bad input, or a rule blocked the request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BookingRequestFailedDetails"
          examples:
            bookingDenied:
              $ref: "#/components/examples/BookingDeniedExample"

    ResourceStatusChanged:
      description: The resource and the open bookings still on it (nothing is auto-cancelled).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResourceStatusChange"
    TooManyRequests:
      description: Too many sign-in attempts from this address; retry later (Retry-After).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUIDv7 string.
      example: "0193f4c2-7a3b-7c3e-8e2a-1f9b6c5d4e3a"

    ProblemDetails:
      type: object
      description: RFC 9457 problem details, extended with a stable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - BOOKING_DENIED
            - SLOT_TAKEN
            - INVALID_TRANSITION
            - STALE_VERSION
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
        detail:
          type: string

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    ValidationProblemDetails:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: "#/components/schemas/FieldError"

    RuleReason:
      type: object
      description: One rule from the evaluation trace that blocked the request.
      required: [ruleId, message]
      properties:
        ruleId:
          type: string
        message:
          type: string

    BookingDeniedProblemDetails:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required: [reasons]
          properties:
            reasons:
              type: array
              items:
                $ref: "#/components/schemas/RuleReason"

    BookingRequestFailedDetails:
      oneOf:
        - $ref: "#/components/schemas/ValidationProblemDetails"
        - $ref: "#/components/schemas/BookingDeniedProblemDetails"
      discriminator:
        propertyName: code
        mapping:
          VALIDATION_FAILED: "#/components/schemas/ValidationProblemDetails"
          BOOKING_DENIED: "#/components/schemas/BookingDeniedProblemDetails"

    FieldType:
      type: string
      enum:
        - text
        - long_text
        - integer
        - number
        - boolean
        - date
        - datetime
        - select
        - multi_select
        - email
        - url
        - phone
        - reference
        - file
        - multi_file

    FieldScope:
      type: string
      enum:
        - resource
        - booking
      description: >
        `resource`: an admin sets the value once per resource instance (e.g. a
        meeting room's TV type); members see it read-only and are never asked
        to fill it in again. `booking`: collected from the member on every
        booking (e.g. number of attendees).

    FieldOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string

    FieldValidation:
      type: object
      description: Only the properties relevant to the field's type are set.
      properties:
        minLength:
          type: integer
        maxLength:
          type: integer
        pattern:
          type: string
        min:
          type: number
        max:
          type: number
        multipleOf:
          type: number
        minItems:
          type: integer
        maxItems:
          type: integer
        targetResourceTypeId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: >
            Required for reference fields: the resource type a reference
            value must belong to (e.g. a meeting room's "primary table"
            field, scoped to the "table" resource type).

    FieldDefinition:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
          description: Permanent identifier. Labels can change freely; keys cannot.
          pattern: "^[a-z][a-z0-9_]*$"
        label:
          type: string
        type:
          $ref: "#/components/schemas/FieldType"
        scope:
          $ref: "#/components/schemas/FieldScope"
          default: resource
        required:
          type: boolean
          default: false
        help:
          type: string
        options:
          type: array
          description: Required for select and multi_select fields.
          items:
            $ref: "#/components/schemas/FieldOption"
        validation:
          $ref: "#/components/schemas/FieldValidation"

    BookingConfirmation:
      type: string
      enum: [instant, approval]

    CheckInPolicy:
      type: object
      required: [required, opensMinutesBefore, noShowAfterMinutes]
      properties:
        required:
          type: boolean
        opensMinutesBefore:
          type: integer
          description: Check-in opens this many minutes before the booking starts.
        noShowAfterMinutes:
          type: integer
          description: Minutes after the start with no check-in before the booking is marked no_show.

    CancellationPolicy:
      type: object
      required: [allowedUntilMinutesBefore]
      properties:
        allowedUntilMinutesBefore:
          type: integer
          description: Cancellation is allowed up to this many minutes before the booking starts.

    FlowConfig:
      type: object
      description: >
        The resource type's booking policies. Example:
        docs/examples/flow-config.json. Payment is a later addition.
      required: [confirmation, checkIn, cancellation]
      properties:
        confirmation:
          $ref: "#/components/schemas/BookingConfirmation"
        checkIn:
          $ref: "#/components/schemas/CheckInPolicy"
        cancellation:
          $ref: "#/components/schemas/CancellationPolicy"
        limits:
          $ref: "#/components/schemas/LimitsPolicy"
        buffers:
          $ref: "#/components/schemas/BuffersPolicy"
        payment:
          $ref: "#/components/schemas/PaymentPolicy"

    LimitsPolicy:
      type: object
      description: >
        Optional in requests: keys left out keep the previous version's value (or the
        platform default). Always returned in full.
      properties:
        minDurationMinutes:
          type: integer
          minimum: 0
        maxDurationMinutes:
          type: integer
          minimum: 1
        leadTimeMinutes:
          type: integer
          minimum: 0
          description: A booking must start at least this many minutes from now.
        bookingWindowDays:
          type: integer
          minimum: 1
          maximum: 730
          description: How many days ahead bookings open.

    BuffersPolicy:
      type: object
      description: Time blocked before and after each booking (setup, cleaning). Not shown to members.
      properties:
        beforeMinutes:
          type: integer
          minimum: 0
        afterMinutes:
          type: integer
          minimum: 0

    RefundRule:
      type: object
      required: [minutesBefore, percent]
      properties:
        minutesBefore:
          type: integer
          minimum: 0
          description: Applies when cancelling at least this many minutes before the start.
        percent:
          type: integer
          minimum: 0
          maximum: 100

    PaymentPolicy:
      type: object
      description: >
        `upfront`: the booking waits in awaiting_payment, holding the slot for
        `holdMinutes`, until paid (gateway webhook or desk). `none`: free.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [none, upfront]
        amountMinor:
          type: integer
          minimum: 0
          description: Price in the tenant currency's minor unit (VND has none).
        per:
          type: string
          enum: [booking, hour]
        holdMinutes:
          type: integer
          minimum: 1
        refundRules:
          type: array
          description: Largest minutesBefore first; the first rule met applies. Empty means 100%.
          items:
            $ref: "#/components/schemas/RefundRule"

    ResourceType:
      type: object
      required: [id, key, label, version, fields, flowConfig, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        label:
          type: string
        version:
          type: integer
          description: Config version this resource type is on.
        slotMinutes:
          type: integer
          nullable: true
          description: Slot length used by availability and booking alignment.
        bookingMode:
          type: string
          enum: [exclusive, capacity, access_pass]
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldDefinition"
        flowConfig:
          $ref: "#/components/schemas/FlowConfig"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateResourceTypeRequest:
      type: object
      required: [key, label, flowConfig]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        label:
          type: string
        slotMinutes:
          type: integer
          default: 30
          description: Must divide a day (5, 10, 15, 20, 30, 60, 120...).
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldDefinition"
          default: []
        flowConfig:
          $ref: "#/components/schemas/FlowConfig"

    UpdateResourceTypeRequest:
      type: object
      required: [baseVersion, flowConfig]
      properties:
        baseVersion:
          type: integer
          description: The resource type's `version` this edit was based on. Stale → `STALE_VERSION`.
        label:
          type: string
        slotMinutes:
          type: integer
        flowConfig:
          $ref: "#/components/schemas/FlowConfig"
          description: An edit that changes no policy key publishes no new version.

    ResourceTypeList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResourceType"
        nextCursor:
          type: string
          nullable: true

    Resource:
      type: object
      required: [id, resourceTypeId, siteId, label, customFieldValues, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        resourceTypeId:
          $ref: "#/components/schemas/Uuid"
        siteId:
          $ref: "#/components/schemas/Uuid"
        label:
          type: string
        code:
          type: string
          description: Readable code, unique per site, derived from the label.
        status:
          $ref: "#/components/schemas/ResourceStatus"
        capacity:
          type: integer
          minimum: 1
        customFieldValues:
          type: object
          description: Keyed by the resource type's field keys.
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateResourceRequest:
      type: object
      required: [resourceTypeId, siteId, label]
      properties:
        resourceTypeId:
          $ref: "#/components/schemas/Uuid"
        siteId:
          $ref: "#/components/schemas/Uuid"
        label:
          type: string
        capacity:
          type: integer
          minimum: 1
          default: 1
        customFieldValues:
          type: object
          additionalProperties: true
          default: {}

    ResourceList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        nextCursor:
          type: string
          nullable: true

    AvailabilitySlot:
      type: object
      required: [start, end, resourceIds]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        resourceIds:
          type: array
          description: Resources of the searched type still free for this whole slot.
          items:
            $ref: "#/components/schemas/Uuid"

    AvailabilityResponse:
      type: object
      required: [siteId, resourceTypeId, date, slotMinutes, slots]
      properties:
        siteId:
          $ref: "#/components/schemas/Uuid"
        resourceTypeId:
          $ref: "#/components/schemas/Uuid"
        date:
          type: string
          format: date
        slotMinutes:
          type: integer
          description: Size of each slot, from the resource type's configuration.
        slots:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilitySlot"

    BookingStatus:
      type: string
      enum:
        - awaiting_payment
        - pending_approval
        - confirmed
        - checked_in
        - completed
        - expired
        - rejected
        - cancelled
        - no_show

    Actor:
      type: object
      description: Who or what triggered a history entry.
      required: [type]
      properties:
        type:
          type: string
          enum: [user, system]
        id:
          $ref: "#/components/schemas/Uuid"

    BookingHistoryEntry:
      type: object
      required: [toStatus, occurredAt, actor]
      properties:
        fromStatus:
          allOf:
            - $ref: "#/components/schemas/BookingStatus"
          description: Absent for the first entry, written when the booking was submitted.
        toStatus:
          $ref: "#/components/schemas/BookingStatus"
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/Actor"

    AppliedConfig:
      type: object
      description: The resource type's policies at the moment this booking was made. Changing settings later never changes this.
      required: [flowConfigVersion, ruleSetVersion, confirmation, checkIn, cancellation]
      properties:
        flowConfigVersion:
          type: integer
        ruleSetVersion:
          type: integer
        confirmation:
          $ref: "#/components/schemas/BookingConfirmation"
        checkIn:
          $ref: "#/components/schemas/CheckInPolicy"
        cancellation:
          $ref: "#/components/schemas/CancellationPolicy"

    Booking:
      type: object
      required:
        - id
        - resourceId
        - resourceTypeId
        - siteId
        - memberId
        - start
        - end
        - status
        - customFieldValues
        - appliedConfig
        - history
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        resourceId:
          $ref: "#/components/schemas/Uuid"
        resourceTypeId:
          $ref: "#/components/schemas/Uuid"
        siteId:
          $ref: "#/components/schemas/Uuid"
        memberId:
          $ref: "#/components/schemas/Uuid"
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/BookingStatus"
        customFieldValues:
          type: object
          additionalProperties: true
        appliedConfig:
          $ref: "#/components/schemas/AppliedConfig"
        history:
          type: array
          items:
            $ref: "#/components/schemas/BookingHistoryEntry"
        publicCode:
          type: string
          description: Short code printed on the ticket, e.g. BK-7F3K2Q.
        channel:
          type: string
          enum: [web, operator, api]
        payment:
          allOf:
            - $ref: "#/components/schemas/PaymentSummary"
          nullable: true
          description: Null only for bookings made before payments were recorded.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateBookingRequest:
      type: object
      required: [resourceId, start, end]
      properties:
        resourceId:
          $ref: "#/components/schemas/Uuid"
        memberId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Defaults to the authenticated user; set to book on behalf of another member.
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        customFieldValues:
          type: object
          additionalProperties: true
          default: {}

    RejectBookingRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: Shown to the member.

    BookingList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        nextCursor:
          type: string
          nullable: true

    ResourceStatus:
      type: string
      enum: [active, inactive, maintenance, archived]

    UpdateResourceRequest:
      type: object
      description: Fields left out are not touched. customFieldValues replaces all values and is checked against the type's latest form.
      properties:
        label:
          type: string
        customFieldValues:
          type: object
          additionalProperties: true

    ResourceMoveRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500

    BookingSummary:
      type: object
      required: [id, publicCode, resourceId, memberId, start, end, status]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        publicCode:
          type: string
        resourceId:
          $ref: "#/components/schemas/Uuid"
        memberId:
          $ref: "#/components/schemas/Uuid"
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/BookingStatus"

    ResourceStatusChange:
      type: object
      required: [resource, affectedBookings]
      properties:
        resource:
          $ref: "#/components/schemas/Resource"
        affectedBookings:
          type: array
          items:
            $ref: "#/components/schemas/BookingSummary"

    AddFieldsRequest:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FieldDefinition"

    PolicyVersion:
      type: object
      required: [version, status, flowConfig]
      properties:
        version:
          type: integer
        status:
          type: string
          enum: [draft, published, superseded]
        basedOnVersion:
          type: integer
          nullable: true
        flowConfig:
          $ref: "#/components/schemas/FlowConfig"
        publishedBy:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true

    PolicyVersionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PolicyVersion"

    RestoreVersionRequest:
      type: object
      required: [baseVersion]
      properties:
        baseVersion:
          type: integer
          description: The current version you saw. Stale → `STALE_VERSION`.

    Site:
      type: object
      required: [id, code, name, timezone, address, status, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        code:
          type: string
        name:
          type: string
        timezone:
          type: string
          description: IANA name. Every local time of the site uses it.
          example: Asia/Ho_Chi_Minh
        address:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [active, inactive, archived]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SiteList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Site"
        nextCursor:
          type: string
          nullable: true

    CreateSiteRequest:
      type: object
      required: [name, timezone]
      properties:
        code:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,39}$"
          description: Derived from the name when left out.
        name:
          type: string
        timezone:
          type: string
        address:
          type: object
          additionalProperties: true

    UpdateSiteRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: object
          additionalProperties: true

    WeeklyHoursRange:
      type: object
      required: [weekday, opens, closes]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Monday ... 6 = Sunday.
        opens:
          type: string
          pattern: "^[0-2][0-9]:[0-5][0-9]$"
          description: Local time of the site, HH:MM.
        closes:
          type: string
          pattern: "^[0-2][0-9]:[0-5][0-9]$"

    SetHoursRequest:
      type: object
      required: [weekly]
      properties:
        weekly:
          type: array
          description: A weekday with no range is closed.
          items:
            $ref: "#/components/schemas/WeeklyHoursRange"

    SiteHours:
      type: object
      required: [siteId, timezone, weekly]
      properties:
        siteId:
          $ref: "#/components/schemas/Uuid"
        timezone:
          type: string
        weekly:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyHoursRange"

    ResourceHours:
      type: object
      required: [resourceId, siteId, timezone, inheritsSiteHours, weekly]
      properties:
        resourceId:
          $ref: "#/components/schemas/Uuid"
        siteId:
          $ref: "#/components/schemas/Uuid"
        timezone:
          type: string
        inheritsSiteHours:
          type: boolean
        weekly:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyHoursRange"

    AvailabilityException:
      type: object
      required: [id, kind, start, end]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        siteId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        resourceId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        kind:
          type: string
          enum: [block, open]
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        reasonCode:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        createdBy:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        createdAt:
          type: string
          format: date-time

    AvailabilityExceptionList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityException"
        nextCursor:
          type: string
          nullable: true

    CreateAvailabilityExceptionRequest:
      type: object
      required: [kind, start, end]
      description: Exactly one of siteId and resourceId.
      properties:
        siteId:
          $ref: "#/components/schemas/Uuid"
        resourceId:
          $ref: "#/components/schemas/Uuid"
        kind:
          type: string
          enum: [block, open]
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        reasonCode:
          type: string
          enum: [holiday, maintenance, private_event, other]
        note:
          type: string

    AvailabilityExceptionCreated:
      type: object
      required: [exception, affectedBookings]
      properties:
        exception:
          $ref: "#/components/schemas/AvailabilityException"
        affectedBookings:
          type: array
          items:
            $ref: "#/components/schemas/BookingSummary"

    BookingPreview:
      type: object
      required: [allowed, status, reasons, slotFree, price, appliedConfig, trace]
      properties:
        allowed:
          type: boolean
          description: True when every step passes and the slot is free right now.
        status:
          allOf:
            - $ref: "#/components/schemas/BookingStatus"
          nullable: true
          description: The status the booking would start in; null when denied.
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/RuleReason"
        slotFree:
          type: boolean
          description: Not binding; the database decides at POST /bookings.
        price:
          type: object
          required: [amountMinor, currency]
          properties:
            amountMinor:
              type: integer
            currency:
              type: string
            breakdown:
              type: object
              additionalProperties: true
        appliedConfig:
          $ref: "#/components/schemas/AppliedConfig"
        trace:
          type: array
          description: Every rule that ran, by stage, and what it did.
          items:
            type: object
            properties:
              stage:
                type: string
              ruleId:
                type: string
              matched:
                type: boolean
                nullable: true
              result:
                type: string

    Permission:
      type: object
      required: [code, description]
      properties:
        code:
          type: string
          example: booking.approve
        description:
          type: string

    PermissionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    Role:
      type: object
      required: [id, code, name, isSystem, permissions, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        code:
          type: string
        name:
          type: string
        isSystem:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    RoleList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    CreateRoleRequest:
      type: object
      required: [code, name, permissions]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,40}$"
        name:
          type: string
        permissions:
          type: array
          items:
            type: string

    SetRolePermissionsRequest:
      type: object
      required: [permissions]
      properties:
        name:
          type: string
        permissions:
          type: array
          items:
            type: string

    RoleGrantRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          description: Role code (e.g. staff) or role id.
        siteId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
          description: Limit the role to one site; absent or null = every site.

    RoleGrant:
      type: object
      required: [roleId, role, siteId]
      properties:
        roleId:
          $ref: "#/components/schemas/Uuid"
        role:
          type: string
        siteId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true

    MemberStatus:
      type: string
      enum: [invited, active, disabled]

    Member:
      type: object
      required: [id, userId, status, roles, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        userId:
          $ref: "#/components/schemas/Uuid"
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/MemberStatus"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleGrant"
        invitedBy:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        joinedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    MemberList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        nextCursor:
          type: string
          nullable: true

    InviteMemberRequest:
      type: object
      required: [email, roles]
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
        roles:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RoleGrantRequest"

    SetMemberRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RoleGrantRequest"

    Me:
      type: object
      required: [userId, tenantId, member, permissions]
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        tenantId:
          $ref: "#/components/schemas/Uuid"
        member:
          $ref: "#/components/schemas/Member"
        permissions:
          type: object
          description: Permission code → site ids where it applies; "*" means every site.
          additionalProperties:
            type: array
            items:
              type: string

    RuleEffect:
      type: object
      required: [type]
      description: >
        deny (any stage) | allowed_groups {groups} (eligibility) | max_duration {minutes},
        advance_window {days}, quota {per: day|week, maxBookings?, maxMinutes?} (limits) |
        require_approval (approval).
      properties:
        type:
          type: string
          enum: [deny, allowed_groups, max_duration, advance_window, quota, require_approval]
      additionalProperties: true

    Rule:
      type: object
      description: Example docs/examples/rule.json.
      required: [id, stage, effect]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
        name:
          type: string
        scope:
          type: object
          description: "{} = whole tenant, or one of siteId, resourceType (key), resourceId."
          properties:
            siteId:
              $ref: "#/components/schemas/Uuid"
            resourceType:
              type: string
            resourceId:
              $ref: "#/components/schemas/Uuid"
        stage:
          type: string
          enum: [eligibility, limits, approval]
        priority:
          type: integer
          default: 0
        when:
          description: JSONLogic over booking, resource, user, user.groups, time, usage. Absent = always.
        effect:
          $ref: "#/components/schemas/RuleEffect"
        message:
          type: string
          description: Shown to the member when this rule says no. Defaults to `name`.
        enabled:
          type: boolean
          default: true

    RuleSet:
      type: object
      required: [version, rules]
      properties:
        version:
          type: integer
        note:
          type: string
          nullable: true
        publishedBy:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        ruleCount:
          type: integer
        rules:
          type: array
          items:
            $ref: "#/components/schemas/Rule"

    RuleSetSummary:
      type: object
      required: [version, ruleCount]
      properties:
        version:
          type: integer
        note:
          type: string
          nullable: true
        publishedBy:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        publishedAt:
          type: string
          format: date-time
        ruleCount:
          type: integer

    RuleSetVersionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RuleSetSummary"

    PublishRulesRequest:
      type: object
      required: [baseVersion, rules]
      properties:
        baseVersion:
          type: integer
          minimum: 0
          description: The current version you saw (0 before the first publish).
        note:
          type: string
        rules:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Rule"

    PaymentStatus:
      type: string
      enum:
        - pending
        - paid
        - failed
        - expired
        - refund_pending
        - refunded
        - partially_refunded
        - waived

    PaymentSummary:
      type: object
      required: [id, status, amountMinor, refundedMinor, currency]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        amountMinor:
          type: integer
        refundedMinor:
          type: integer
        currency:
          type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true

    Refund:
      type: object
      required: [id, paymentId, amountMinor, status, reasonCode, requestedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        paymentId:
          $ref: "#/components/schemas/Uuid"
        amountMinor:
          type: integer
        status:
          type: string
          enum: [pending, succeeded, failed]
        reasonCode:
          type: string
        appliedRule:
          type: object
          nullable: true
          additionalProperties: true
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    PaymentEvent:
      type: object
      required: [id, gateway, gatewayEventId, type, signatureVerified, outcome, receivedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        paymentId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        gateway:
          type: string
        gatewayEventId:
          type: string
        type:
          type: string
        signatureVerified:
          type: boolean
        outcome:
          type: string
          enum: [applied, duplicate, ignored, needs_reconciliation]
        receivedAt:
          type: string
          format: date-time

    PaymentEventList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PaymentEvent"

    Payment:
      allOf:
        - $ref: "#/components/schemas/PaymentSummary"
        - type: object
          required: [bookingId, gateway, refunds, events, history]
          properties:
            bookingId:
              $ref: "#/components/schemas/Uuid"
            gateway:
              type: string
            method:
              type: string
              nullable: true
            sessionId:
              type: string
              nullable: true
            paidAt:
              type: string
              format: date-time
              nullable: true
            refunds:
              type: array
              items:
                $ref: "#/components/schemas/Refund"
            events:
              type: array
              items:
                $ref: "#/components/schemas/PaymentEvent"
            history:
              type: array
              items:
                type: object
                required: [toStatus, action, actorKind, occurredAt]
                properties:
                  fromStatus:
                    type: string
                    nullable: true
                  toStatus:
                    type: string
                  action:
                    type: string
                  actorKind:
                    type: string
                    enum: [user, system, gateway, api_client]
                  occurredAt:
                    type: string
                    format: date-time

    MarkPaidRequest:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [cash, card, bank_transfer, other]
        note:
          type: string

    PaymentWebhookRequest:
      type: object
      required: [eventId, type]
      description: The mock gateway's message. A real gateway gets its own adapter.
      properties:
        eventId:
          type: string
        type:
          type: string
          enum: [payment.succeeded, payment.failed, refund.succeeded, refund.failed]
        sessionId:
          type: string
          description: Payment.sessionId, for payment.* messages.
        refundId:
          $ref: "#/components/schemas/Uuid"
        amountMinor:
          type: integer
        paymentRef:
          type: string
        reason:
          type: string

    WebhookAck:
      type: object
      required: [received, outcome]
      properties:
        received:
          type: boolean
        outcome:
          type: string
          enum: [applied, duplicate, ignored, needs_reconciliation]

    Event:
      type: object
      description: docs/examples/event.json plus delivery state.
      required: [id, name, version, tenantId, subject, actor, occurredAt, changes, configVersions, delivery]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: booking.confirmed
        version:
          type: integer
        tenantId:
          $ref: "#/components/schemas/Uuid"
        subject:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
            id:
              type: string
        actor:
          $ref: "#/components/schemas/Actor"
        occurredAt:
          type: string
          format: date-time
        changes:
          type: object
          additionalProperties: true
        configVersions:
          type: object
          additionalProperties:
            type: integer
        data:
          type: object
          additionalProperties: true
        delivery:
          type: object
          required: [publishedAt, attempts]
          properties:
            publishedAt:
              type: string
              format: date-time
              nullable: true
            attempts:
              type: integer
            lastError:
              type: string
              nullable: true

    EventList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        nextCursor:
          type: string
          nullable: true

    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: At least 8 characters, not all digits, not a common password.
        fullName:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: The `token` query parameter of the emailed link.
        password:
          type: string
          minLength: 8

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    AcceptInvitationLinkRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
        password:
          type: string
          description: "New person: the password to set. Existing account: its current password."
        fullName:
          type: string

    GuestTokenRequest:
      type: object
      required: [tenantId, name]
      properties:
        tenantId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    SignedInUser:
      type: object
      required: [id, email, fullName]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        email:
          type: string
          nullable: true
        fullName:
          type: string
          nullable: true

    TokenPair:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: "JWT for `Authorization: Bearer`. Short-lived."
        refreshToken:
          type: string
          description: Single use; exchange it at /auth/refresh. Absent for guests.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Seconds until the access token expires.
        user:
          $ref: "#/components/schemas/SignedInUser"

    InvitationAccepted:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [tenantId]
          properties:
            tenantId:
              $ref: "#/components/schemas/Uuid"

    GuestToken:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [tenantId, memberId]
          properties:
            tenantId:
              $ref: "#/components/schemas/Uuid"
            memberId:
              $ref: "#/components/schemas/Uuid"

    Accepted:
      type: object
      required: [sent]
      properties:
        sent:
          type: boolean

    MyTenant:
      type: object
      required: [tenantId, slug, name, memberId, status]
      properties:
        tenantId:
          $ref: "#/components/schemas/Uuid"
        slug:
          type: string
        name:
          type: string
        memberId:
          $ref: "#/components/schemas/Uuid"
        status:
          $ref: "#/components/schemas/MemberStatus"

    MyTenantList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MyTenant"

