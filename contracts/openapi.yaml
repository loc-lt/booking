openapi: 3.1.0

info:
  title: Booking Core API
  version: "1"
  description: >
    The booking core API. See docs/api.md for conventions and the contract
    workflow. This file is the only description of the API; the client, Zod
    schemas and mocks in web/packages/api-client are generated from it.

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: resource-types
    description: Templates for bookable things (desk, meeting room, phone booth).
  - name: resources
    description: Individual bookable things of a resource type.
  - name: availability
    description: Free/busy search over a resource type's resources.
  - name: bookings
    description: Requests for a resource and the lifecycle moves they go through.

paths:
  /resource-types:
    get:
      operationId: listResourceTypes
      summary: List resource types
      description: Lists the tenant's resource types, newest first.
      tags: [resource-types]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of resource types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceTypeList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createResourceType
      summary: Create a resource type
      description: Creates a resource type with its custom field definitions, published immediately.
      tags: [resource-types]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceTypeRequest"
            examples:
              phoneBooth:
                $ref: "#/components/examples/CreateResourceTypeRequestPhoneBooth"
      responses:
        "201":
          description: The created resource type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceType"
              examples:
                phoneBooth:
                  $ref: "#/components/examples/ResourceTypePhoneBooth"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /resource-types/{resourceTypeId}:
    get:
      operationId: getResourceType
      summary: Get a resource type
      description: Returns one resource type by id.
      tags: [resource-types]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ResourceTypeId"
      responses:
        "200":
          description: The resource type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceType"
              examples:
                phoneBooth:
                  $ref: "#/components/examples/ResourceTypePhoneBooth"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /resources:
    get:
      operationId: listResources
      summary: List resources
      description: Lists the tenant's resources, optionally filtered by type or site.
      tags: [resources]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: resourceTypeId
          in: query
          description: Only resources of this type.
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: siteId
          in: query
          description: Only resources at this site.
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: A page of resources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createResource
      summary: Create a resource
      description: Creates one bookable resource of an existing resource type at a site.
      tags: [resources]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceRequest"
            examples:
              phoneBooth1:
                $ref: "#/components/examples/CreateResourceRequestPhoneBooth1"
      responses:
        "201":
          description: The created resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
              examples:
                phoneBooth1:
                  $ref: "#/components/examples/ResourcePhoneBooth1"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /resources/{resourceId}:
    get:
      operationId: getResource
      summary: Get a resource
      description: Returns one resource by id.
      tags: [resources]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
              examples:
                phoneBooth1:
                  $ref: "#/components/examples/ResourcePhoneBooth1"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /availability:
    get:
      operationId: searchAvailability
      summary: Search free slots
      description: >
        Returns the day's slots for a resource type at a site, each with the
        resources still free for it. Applies hours, blackouts, slot size and
        buffers from the resource type's configuration.
      tags: [availability]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: siteId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: resourceTypeId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: date
          in: query
          description: The site-local calendar day to search.
          required: true
          schema:
            type: string
            format: date
        - name: resourceId
          in: query
          description: Only report free/busy for this one resource.
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: The day's slots and which resources are free for each.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
              examples:
                meetingRoomDay:
                  $ref: "#/components/examples/AvailabilityResponseExample"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /bookings:
    get:
      operationId: listBookings
      summary: List bookings
      description: Lists the tenant's bookings, newest first, optionally filtered.
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: resourceId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: resourceTypeId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: siteId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: memberId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: status
          in: query
          description: Only bookings in this status.
          required: false
          schema:
            $ref: "#/components/schemas/BookingStatus"
        - name: from
          in: query
          description: Only bookings overlapping this range (inclusive).
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: A page of bookings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createBooking
      summary: Submit a booking request
      description: >
        Runs the request through the booking pipeline (docs/domain/booking.md).
        Denied requests save nothing and return `BOOKING_DENIED` with the
        rules that blocked it.
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
            examples:
              meetingRoomRequest:
                $ref: "#/components/examples/CreateBookingRequestExample"
      responses:
        "201":
          description: The created booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
              examples:
                meetingRoomConfirmed:
                  $ref: "#/components/examples/BookingConfirmedExample"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SlotTaken"
        "422":
          $ref: "#/components/responses/BookingRequestFailed"

  /bookings/{bookingId}:
    get:
      operationId: getBooking
      summary: Get a booking
      description: Returns one booking by id, including the config it was made under and its status history.
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: The booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
              examples:
                meetingRoomConfirmed:
                  $ref: "#/components/examples/BookingConfirmedExample"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /bookings/{bookingId}/check-in:
    post:
      operationId: checkInBooking
      summary: Check in
      description: Moves a confirmed booking to checked_in. Only inside the resource type's check-in window.
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: The updated booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidTransition"

  /bookings/{bookingId}/cancel:
    post:
      operationId: cancelBooking
      summary: Cancel
      description: Moves an awaiting_payment, pending_approval or confirmed booking to cancelled. Runs the cancellation policy.
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: The updated booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidTransition"

  /bookings/{bookingId}/approve:
    post:
      operationId: approveBooking
      summary: Approve
      description: Moves a pending_approval booking to confirmed.
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: The updated booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidTransition"

  /bookings/{bookingId}/reject:
    post:
      operationId: rejectBooking
      summary: Reject
      description: Moves a pending_approval booking to rejected and releases any held payment.
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectBookingRequest"
      responses:
        "200":
          description: The updated booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidTransition"
        "422":
          $ref: "#/components/responses/ValidationFailed"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      description: The tenant to act on behalf of, checked against the caller's memberships.
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    ResourceTypeId:
      name: resourceTypeId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Replaying the same key returns the original result instead of creating a second booking.
      required: true
      schema:
        type: string

  responses:
    Unauthenticated:
      description: Missing, invalid or expired token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: Not allowed in this tenant.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: No resource with that id in this tenant.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ValidationFailed:
      description: The request body failed validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblemDetails"
    SlotTaken:
      description: Someone else holds the slot.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InvalidTransition:
      description: A move the lifecycle doesn't allow from the booking's current status.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    BookingRequestFailed:
      description: Bad input, or a rule blocked the request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BookingRequestFailedDetails"
          examples:
            bookingDenied:
              $ref: "#/components/examples/BookingDeniedExample"

  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUIDv7 string.
      example: "0193f4c2-7a3b-7c3e-8e2a-1f9b6c5d4e3a"

    ProblemDetails:
      type: object
      description: RFC 9457 problem details, extended with a stable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - BOOKING_DENIED
            - SLOT_TAKEN
            - INVALID_TRANSITION
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
        detail:
          type: string

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    ValidationProblemDetails:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: "#/components/schemas/FieldError"

    RuleReason:
      type: object
      description: One rule from the evaluation trace that blocked the request.
      required: [ruleId, message]
      properties:
        ruleId:
          type: string
        message:
          type: string

    BookingDeniedProblemDetails:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required: [reasons]
          properties:
            reasons:
              type: array
              items:
                $ref: "#/components/schemas/RuleReason"

    BookingRequestFailedDetails:
      oneOf:
        - $ref: "#/components/schemas/ValidationProblemDetails"
        - $ref: "#/components/schemas/BookingDeniedProblemDetails"
      discriminator:
        propertyName: code
        mapping:
          VALIDATION_FAILED: "#/components/schemas/ValidationProblemDetails"
          BOOKING_DENIED: "#/components/schemas/BookingDeniedProblemDetails"

    FieldType:
      type: string
      enum:
        - text
        - long_text
        - integer
        - number
        - boolean
        - date
        - datetime
        - select
        - multi_select
        - email
        - url
        - phone
        - reference
        - file
        - multi_file

    FieldOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string

    FieldValidation:
      type: object
      description: Only the properties relevant to the field's type are set.
      properties:
        minLength:
          type: integer
        maxLength:
          type: integer
        pattern:
          type: string
        min:
          type: number
        max:
          type: number
        multipleOf:
          type: number
        minItems:
          type: integer
        maxItems:
          type: integer

    FieldDefinition:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
          description: Permanent identifier. Labels can change freely; keys cannot.
          pattern: "^[a-z][a-z0-9_]*$"
        label:
          type: string
        type:
          $ref: "#/components/schemas/FieldType"
        required:
          type: boolean
          default: false
        help:
          type: string
        options:
          type: array
          description: Required for select and multi_select fields.
          items:
            $ref: "#/components/schemas/FieldOption"
        validation:
          $ref: "#/components/schemas/FieldValidation"

    BookingConfirmation:
      type: string
      enum: [instant, approval]

    CheckInPolicy:
      type: object
      required: [required, opensMinutesBefore, noShowAfterMinutes]
      properties:
        required:
          type: boolean
        opensMinutesBefore:
          type: integer
          description: Check-in opens this many minutes before the booking starts.
        noShowAfterMinutes:
          type: integer
          description: Minutes after the start with no check-in before the booking is marked no_show.

    CancellationPolicy:
      type: object
      required: [allowedUntilMinutesBefore]
      properties:
        allowedUntilMinutesBefore:
          type: integer
          description: Cancellation is allowed up to this many minutes before the booking starts.

    FlowConfig:
      type: object
      description: >
        The resource type's booking policies. Example:
        docs/examples/flow-config.json. Payment is a later addition.
      required: [confirmation, checkIn, cancellation]
      properties:
        confirmation:
          $ref: "#/components/schemas/BookingConfirmation"
        checkIn:
          $ref: "#/components/schemas/CheckInPolicy"
        cancellation:
          $ref: "#/components/schemas/CancellationPolicy"

    ResourceType:
      type: object
      required: [id, key, label, version, fields, flowConfig, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        label:
          type: string
        version:
          type: integer
          description: Config version this resource type is on.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldDefinition"
        flowConfig:
          $ref: "#/components/schemas/FlowConfig"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateResourceTypeRequest:
      type: object
      required: [key, label, flowConfig]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        label:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldDefinition"
          default: []
        flowConfig:
          $ref: "#/components/schemas/FlowConfig"

    ResourceTypeList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResourceType"
        nextCursor:
          type: string
          nullable: true

    Resource:
      type: object
      required: [id, resourceTypeId, siteId, label, customFieldValues, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        resourceTypeId:
          $ref: "#/components/schemas/Uuid"
        siteId:
          $ref: "#/components/schemas/Uuid"
        label:
          type: string
        customFieldValues:
          type: object
          description: Keyed by the resource type's field keys.
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateResourceRequest:
      type: object
      required: [resourceTypeId, siteId, label]
      properties:
        resourceTypeId:
          $ref: "#/components/schemas/Uuid"
        siteId:
          $ref: "#/components/schemas/Uuid"
        label:
          type: string
        customFieldValues:
          type: object
          additionalProperties: true
          default: {}

    ResourceList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        nextCursor:
          type: string
          nullable: true

    AvailabilitySlot:
      type: object
      required: [start, end, resourceIds]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        resourceIds:
          type: array
          description: Resources of the searched type still free for this whole slot.
          items:
            $ref: "#/components/schemas/Uuid"

    AvailabilityResponse:
      type: object
      required: [siteId, resourceTypeId, date, slotMinutes, slots]
      properties:
        siteId:
          $ref: "#/components/schemas/Uuid"
        resourceTypeId:
          $ref: "#/components/schemas/Uuid"
        date:
          type: string
          format: date
        slotMinutes:
          type: integer
          description: Size of each slot, from the resource type's configuration.
        slots:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilitySlot"

    BookingStatus:
      type: string
      enum:
        - awaiting_payment
        - pending_approval
        - confirmed
        - checked_in
        - completed
        - expired
        - rejected
        - cancelled
        - no_show

    Actor:
      type: object
      description: Who or what triggered a history entry.
      required: [type]
      properties:
        type:
          type: string
          enum: [user, system]
        id:
          $ref: "#/components/schemas/Uuid"

    BookingHistoryEntry:
      type: object
      required: [toStatus, occurredAt, actor]
      properties:
        fromStatus:
          allOf:
            - $ref: "#/components/schemas/BookingStatus"
          description: Absent for the first entry, written when the booking was submitted.
        toStatus:
          $ref: "#/components/schemas/BookingStatus"
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/Actor"

    AppliedConfig:
      type: object
      description: The resource type's policies at the moment this booking was made. Changing settings later never changes this.
      required: [flowConfigVersion, ruleSetVersion, confirmation, checkIn, cancellation]
      properties:
        flowConfigVersion:
          type: integer
        ruleSetVersion:
          type: integer
        confirmation:
          $ref: "#/components/schemas/BookingConfirmation"
        checkIn:
          $ref: "#/components/schemas/CheckInPolicy"
        cancellation:
          $ref: "#/components/schemas/CancellationPolicy"

    Booking:
      type: object
      required:
        - id
        - resourceId
        - resourceTypeId
        - siteId
        - memberId
        - start
        - end
        - status
        - customFieldValues
        - appliedConfig
        - history
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        resourceId:
          $ref: "#/components/schemas/Uuid"
        resourceTypeId:
          $ref: "#/components/schemas/Uuid"
        siteId:
          $ref: "#/components/schemas/Uuid"
        memberId:
          $ref: "#/components/schemas/Uuid"
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/BookingStatus"
        customFieldValues:
          type: object
          additionalProperties: true
        appliedConfig:
          $ref: "#/components/schemas/AppliedConfig"
        history:
          type: array
          items:
            $ref: "#/components/schemas/BookingHistoryEntry"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateBookingRequest:
      type: object
      required: [resourceId, start, end]
      properties:
        resourceId:
          $ref: "#/components/schemas/Uuid"
        memberId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Defaults to the authenticated user; set to book on behalf of another member.
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        customFieldValues:
          type: object
          additionalProperties: true
          default: {}

    RejectBookingRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: Shown to the member.

    BookingList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        nextCursor:
          type: string
          nullable: true

